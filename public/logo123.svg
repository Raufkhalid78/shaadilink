<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Premium Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4914d" />
      <stop offset="30%" stop-color="#f0d78c" />
      <stop offset="50%" stop-color="#d4a853" />
      <stop offset="75%" stop-color="#fff4d0" />
      <stop offset="100%" stop-color="#8b6d2f" />
    </linearGradient>
    <!-- Dark Emerald Background Gradient -->
    <radialGradient id="emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f211b" />
      <stop offset="100%" stop-color="#050a08" />
    </radialGradient>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#emerald)" stroke="url(#gold)" stroke-width="3" />
  
  <!-- Subtle Inner Border -->
  <rect x="7" y="7" width="86" height="86" rx="19" fill="none" stroke="url(#gold)" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Intertwined Hearts / Links Emblem -->
  <g transform="translate(18, 22) scale(1.35)">
    <!-- First Heart (Left, slightly tilted) -->
    <path d="M 12 6 C 12 6, 10 3, 6.5 3 C 3.5 3, 1.5 5, 1.5 8 C 1.5 12, 7 16, 12 19.5 C 17 16, 22.5 12, 22.5 8 C 22.5 5, 20.5 3, 17.5 3 C 14 3, 12 6, 12 6 Z" 
          fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Second Intersecting Heart (Right, tilted and offset) -->
    <path d="M 22 10 C 22 10, 20 7, 16.5 7 C 13.5 7, 11.5 9, 11.5 12 C 11.5 16, 17 20, 22 23.5 C 27 20, 32.5 16, 32.5 12 C 32.5 9, 30.5 7, 27.5 7 C 24 7, 22 10, 22 10 Z" 
          fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- Ornate Sparkles -->
  <!-- Top Right Sparkle -->
  <path d="M 78 22 Q 78 28 84 28 Q 78 28 78 34 Q 78 28 72 28 Q 78 28 78 22" fill="url(#gold)" />
  <!-- Bottom Left Sparkle -->
  <path d="M 22 72 Q 22 76 26 76 Q 22 76 22 80 Q 22 76 18 76 Q 22 76 22 72" fill="url(#gold)" />
</svg>
