<!DOCTYPE html>
<html>
<head>
<style>
.relative { position: relative; }
.overflow-hidden { overflow: hidden; }
.absolute { position: absolute; }
.inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-center { justify-content: center; }
.w-full { width: 100%; }
.h-full { height: 100%; }
.pt-8 { padding-top: 2rem; }
</style>
</head>
<body>
<div class="relative overflow-hidden" style="width: 340px; height: 340px; background: red;">
  <div class="absolute inset-0 flex flex-col items-center justify-center" style="background: blue; opacity: 0.5;">
    <div class="absolute top-0 left-0 w-full h-full flex flex-col items-center justify-center pt-8" style="background: green; opacity: 0.5;">
      <div>Text 1</div>
      <div>Text 2</div>
    </div>
  </div>
</div>
</body>
</html>
