<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Obsidian to Emerald -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" /> <!-- emerald-900 -->
      <stop offset="100%" stop-color="#020617" /> <!-- slate-950 -->
    </linearGradient>

    <!-- Gold Gradients for Paper -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0c3" />
      <stop offset="100%" stop-color="#e2aa3f" />
    </linearGradient>

    <linearGradient id="goldMedium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#8a6100" />
    </linearGradient>
    
    <!-- Shadow for depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="12" stdDeviation="12" flood-opacity="0.5" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#bgGrad)" />

  <!-- Digital Flight Trails / Tech Lines -->
  <!-- Arc trails -->
  <path d="M 80 420 Q 180 480 320 380" fill="none" stroke="url(#goldDark)" stroke-width="8" stroke-dasharray="16 16" opacity="0.6" stroke-linecap="round"/>
  <path d="M 40 340 Q 120 400 240 320" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="12 12" opacity="0.7" stroke-linecap="round"/>
  
  <!-- Straight dash trail -->
  <path d="M 60 260 L 140 220" fill="none" stroke="url(#goldMedium)" stroke-width="6" stroke-dasharray="12 12" opacity="0.8" stroke-linecap="round"/>

  <!-- Origami Airplane -->
  <g filter="url(#dropShadow)">
    
    <!-- Left Wing (Top Surface, brightly lit) -->
    <polygon points="440,72 72,220 240,280" fill="url(#goldLight)" />
    
    <!-- Right Wing (Inner Surface, slightly shaded) -->
    <polygon points="440,72 240,280 360,440" fill="url(#goldMedium)" />
    
    <!-- Keel / Underbelly (Darkest shadow) -->
    <polygon points="440,72 240,280 180,380" fill="url(#goldDark)" />

  </g>
</svg>